<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AL Magazine Online | iPhone Original Lacrado em Pompeia-SP</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif}</style>
</head>
<body class="bg-zinc-50 text-zinc-900">
<header class="bg-black text-white sticky top-0 z-50">
<div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
<div class="font-black text-xl tracking-widest">AL <span class="text-[#1992C9]">MAGAZINE</span></div>
<nav class="hidden md:flex gap-6 text-sm">
<a href="#inicio">Início</a><a href="#sobre">Sobre</a><a href="#produtos">Produtos</a><a href="#depoimentos">Depoimentos</a><a href="#faq">FAQ</a><a href="#contato">Contato</a>
</nav>
<a href="https://wa.me/5514981841132" class="bg-[#1992C9] px-4 py-2 rounded-full text-sm font-bold">WhatsApp</a>
</div>
</header>

<section class="bg-black text-white"><div class="max-w-7xl mx-auto px-4 py-16 text-center">
<h1 class="text-4xl font-black">iPhone Original <span class="text-[#1992C9]">Lacrado EUA</span> com Garantia 12 Meses</h1>
<p class="text-zinc-400 mt-2">Pompeia-SP | Entrega todo Brasil | (14) 98184-1132</p>
</div></section>

<section id="produtos" class="bg-white py-12">
<div class="max-w-7xl mx-auto px-4">
<h2 class="text-2xl font-black mb-6">Produtos (<span id="count">0</span>)</h2>
<div id="grid" class="grid md:grid-cols-3 gap-6"></div>
<div id="debug" class="mt-6 p-3 bg-yellow-100 text-xs rounded"></div>
</div>
</section>

<script>
fetch('produtos.json?v='+Date.now())
.then(r=>{ if(!r.ok) throw new Error('produtos.json não encontrado'); return r.json(); })
.then(produtos=>{
  console.log('produtos carregados', produtos);
  document.getElementById('count').innerText = produtos.length;
  document.getElementById('debug').innerText = 'JSON carregado com ' + produtos.length + ' produtos';
  const grid=document.getElementById('grid');
  if(produtos.length===0){ grid.innerHTML='<p>Nenhum produto no JSON</p>'; return; }
  grid.innerHTML=produtos.map(p=>{
    const temFoto = p.imagem && p.imagem.length>5;
    const imgHtml = temFoto ? `<img src="${p.imagem}" class="h-48 w-full object-cover rounded-xl mb-3 bg-zinc-100" onerror="this.src='https://via.placeholder.com/300x200?text=Sem+Foto'">` : `<div class="bg-zinc-100 h-48 rounded-xl flex items-center justify-center text-4xl mb-3">📱</div>`;
    return `
    <div class="border rounded-2xl p-4 hover:shadow-lg">
      ${imgHtml}
      <span class="text-xs bg-black text-white px-2 py-1 rounded">${p.categoria||''}</span>
      <h3 class="font-bold mt-2">${p.nome}</h3>
      <p class="text-[#1992C9] font-black text-lg mt-1">PIX ${p.preco_pix_fmt || ('R$ '+p.preco_pix)}</p>
      <p class="text-zinc-500 text-sm">${p.preco_parcelado||''}</p>
      <a href="https://wa.me/5514981841132?text=Ol%C3%A1%20quero%20o%20${encodeURIComponent(p.nome)}" target="_blank" class="block text-center mt-3 bg-black text-white py-2.5 rounded-xl font-bold hover:bg-[#1992C9]">Comprar no WhatsApp</a>
    </div>`;
  }).join('');
})
.catch(err=>{
  document.getElementById('debug').innerText = 'ERRO: '+err.message + ' - Verifique se produtos.json está na mesma pasta que index.html (minúsculo)';
  document.getElementById('grid').innerHTML='<p class="text-red-500">Erro ao carregar produtos.json. Veja debug abaixo.</p>';
});
</script>
</body>
</html>
